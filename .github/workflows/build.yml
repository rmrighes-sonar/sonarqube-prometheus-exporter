name: Build and push

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  sonarqube:
    # Scans on every push and PR so SonarQube has both branch and PR
    # analyses to decorate. Independent of the `build` job below -- a scan
    # failure/timeout should never block the container publish, and vice
    # versa.
    #
    # Requires SONAR_TOKEN (repo secret) and SONAR_HOST_URL (repo variable)
    # to be set, and the target SonarQube server (this repo's sibling
    # sonarqube-compose stack, tunnelled via ngrok) to be reachable from
    # GitHub-hosted runners at scan time -- see that repo's README
    # "GitHub Integration" section.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # disable shallow clone for better analysis relevancy

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  build:
    # Only publish an image from main -- pull_request runs of this workflow
    # should only run the sonarqube job above.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Vet and build (fail fast before pushing an image)
        run: |
          go vet ./...
          go build ./...

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (for cross-building the arm64 image)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # linux/amd64 for typical CI/cloud hosts, linux/arm64 for Apple
          # Silicon Macs (and arm64 servers) -- docker automatically pulls
          # the manifest matching the local machine's architecture.
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
