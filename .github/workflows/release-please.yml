name: release-please

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release-please:
    # Maintains a standing "Release PR" summarizing every Conventional
    # Commit merged to main since the last release; merging that PR is what
    # actually cuts the tag + GitHub Release (see release-please-config.json
    # / .release-please-manifest.json). Ordinary commits to main just update
    # the pending PR, they don't publish anything.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-release-image:
    # Promotes semver tags onto the *already-published* :<sha> image
    # instead of rebuilding -- ci.yml's `publish` job already built and
    # pushed this exact commit's multi-arch image (as :<sha>) the moment it
    # landed on main, and that same commit passed build/test/sonarqube to
    # get there. Rebuilding here would be a third recompile of identical
    # code for no reason; `docker buildx imagetools create` instead copies
    # the existing multi-arch manifest directly onto the version tags --
    # zero compilation, zero image rebuilding. Only runs when release-please
    # actually cuts a new release (i.e. its Release PR was just merged), not
    # on every ordinary commit.
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        # imagetools needs a buildx builder context to talk to the
        # registry, even though it isn't building anything itself.
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Promote :<sha> to version tags
        run: |
          docker buildx imagetools create \
            --tag "${{ env.IMAGE }}:${{ needs.release-please.outputs.version }}" \
            --tag "${{ env.IMAGE }}:${{ needs.release-please.outputs.major }}.${{ needs.release-please.outputs.minor }}" \
            --tag "${{ env.IMAGE }}:${{ needs.release-please.outputs.major }}" \
            "${{ env.IMAGE }}:${{ needs.release-please.outputs.sha }}"
