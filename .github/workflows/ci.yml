name: CI

# One workflow, one visible pipeline graph: build -> test -> sonarqube ->
# publish. Build-once, reuse-everywhere: the Go compiler runs exactly twice
# total (this file's `build` cross-compile, `test`'s test-compile) --
# `sonarqube` reuses test's coverage artifact instead of re-running tests,
# and `publish`'s Docker image is assembled from build's prebuilt binaries
# instead of recompiling inside the container (see Dockerfile).
on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  changes:
    # Determines whether this push/PR only touches release-please's
    # CHANGELOG.md / .release-please-manifest.json. Deliberately not using
    # `paths-ignore` on the triggers above for this: build/test/sonarqube
    # are required status checks in branch protection, and a workflow that
    # never runs at all for a given commit (via paths-ignore) leaves those
    # checks permanently stuck as "Expected" -- unmergeable, with no
    # override since enforce_admins is on. Instead this job always runs (so
    # the checks always get a chance to report), and downstream jobs skip
    # their real work via `if:`/needs: cascading for a release-only diff. A
    # job skipped via `if:` reports conclusion "skipped", which GitHub
    # explicitly treats as passing for required status check purposes.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_only: ${{ steps.check.outputs.release_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: check
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "No usable base commit to diff against (new branch or unavailable history) -- treating as a real change."
            echo "release_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED="$(git diff --name-only "$BASE" "${{ github.sha }}")"
          echo "Changed files vs $BASE:"
          echo "$CHANGED"
          if [ -n "$CHANGED" ] && ! grep -qvE '^(CHANGELOG\.md|\.release-please-manifest\.json)$' <<< "$CHANGED"; then
            echo "-> release-please changelog/manifest-only change, skipping build/test/sonarqube/publish"
            echo "release_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_only=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.release_only != 'true'
    # go vet, then cross-compile the two binaries the rest of the pipeline
    # needs -- Go's cross-compiler targets linux/amd64 and linux/arm64
    # natively (CGO_ENABLED=0, no gcc/QEMU needed), so this is fast even for
    # the non-native arch.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Cross-compile linux/amd64 + linux/arm64 binaries
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            mkdir -p "dist/linux/${arch}"
            echo "== building linux/${arch} =="
            GOOS=linux GOARCH="${arch}" CGO_ENABLED=0 \
              go build -trimpath -ldflags="-s -w" \
              -o "dist/linux/${arch}/sonarqube-prometheus-exporter" .
          done

      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: dist/
          retention-days: 1

  test:
    needs: build
    # Doesn't consume build's binaries -- the needs: edge is purely for
    # fail-fast ordering (don't bother testing if vet/cross-compile already
    # failed).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      - name: Test with coverage
        # sonar-project.properties points sonar.go.coverage.reportPaths at
        # this exact file/format (Go's native cover profile) -- SonarQube's
        # Go analyzer reads it directly, no conversion step needed.
        run: go test ./... -coverprofile=coverage.out

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 1

  sonarqube:
    needs: test
    # Requires SONAR_TOKEN (repo secret) and SONAR_HOST_URL (repo variable)
    # to be set, and the target SonarQube server (this repo's sibling
    # sonarqube-compose stack, tunnelled via ngrok) to be reachable from
    # GitHub-hosted runners at scan time -- see that repo's README
    # "GitHub Integration" section.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # disable shallow clone for better analysis relevancy

      - uses: actions/download-artifact@v8
        with:
          name: coverage

      - name: Determine project version
        # Without an explicit sonar.projectVersion, every analysis records
        # "not provided" as the version (visible in SonarQube's own
        # Activity log/API). release-please's manifest is the single
        # source of truth for "the current released version" -- it's
        # accurate immediately after a release, and still the most recent
        # meaningful version for ordinary commits/PRs in between releases.
        id: version
        run: echo "value=$(jq -r '.["."]' .release-please-manifest.json)" >> "$GITHUB_OUTPUT"

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7.1.0
        with:
          args: >
            -Dsonar.projectVersion=${{ steps.version.outputs.value }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  publish:
    # Only sonarqube listed here, not [build, test, sonarqube] -- naming all
    # three drew three separate edges into this job on the Actions graph
    # (build -> publish, test -> publish, sonarqube -> publish), which
    # visually looks like a shortcut around sonarqube even though it isn't
    # one. sonarqube alone is sufficient and produces a clean, honest
    # straight-line graph: sonarqube can only report success if test (and
    # transitively build) already did, so success() below still correctly
    # requires all three to have succeeded. Artifact download by name below
    # is unaffected either way -- it works across any jobs in the same run
    # regardless of needs: declarations.
    needs: sonarqube
    # Only publish an image from main, and only once the quality gate has
    # passed -- unlike the old design, an image can no longer publish while
    # sonarqube is failing. An explicit `if:` replaces the default implicit
    # success()-on-needs check entirely (GitHub doesn't AND them together),
    # so success() must be spelled out here too -- otherwise this would
    # still attempt to run (and fail downloading build's never-uploaded
    # artifact) on a release-only push where build/test/sonarqube all
    # skipped rather than succeeded.
    if: github.event_name == 'push' && success()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: dist/

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        # No QEMU setup needed -- the Dockerfile only COPYs a prebuilt
        # binary per platform, it never executes anything arch-specific.
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
