name: CI

# One workflow, one visible pipeline graph:
#
#   version -> build -> test -> sonarqube -> release -> publish
#
# `version` computes the next semantic version (from Conventional Commits
# since the last tag, via semantic-release --dry-run) and runs first,
# sequentially before build -- deliberate, not a data dependency (build
# doesn't consume version's output): the version for a commit should be
# settled before anything else about that commit is validated. It only
# exists on `push` -- see that job for why -- and `build` explicitly
# tolerates it being skipped so pull_request runs still get validated.
#
# Build-once, reuse-everywhere still holds: the Go compiler runs exactly
# twice total (`build`'s cross-compile, `test`'s test-compile).
# `sonarqube` reuses test's coverage artifact instead of re-running tests,
# and `publish`'s Docker image is assembled from build's prebuilt binaries
# instead of recompiling inside the container (see Dockerfile).
#
# `release` only runs the real (non-dry-run) semantic-release on a `push`
# to `main`, after `sonarqube` passes. Every merge to `main` now gets its
# own tagged release -- this replaced release-please's PR-batching model
# (see README.md's "Releases" section) -- so `publish` no longer needs a
# separate "promote an already-built image's tags after the fact" step
# the way the old release-please.yml did: it builds and pushes every tag
# (:latest, :<sha>, and the version tags) in one place, once, right after
# release confirms what version this commit became.
on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  version:
    # Only exists on `push`: semantic-release's branch-matching check reads
    # GitHub's own GITHUB_REF directly and can never pass on a
    # `pull_request`'s detached synthetic merge ref regardless of
    # dryRun/ci options (confirmed by testing in the sibling
    # sonarqube-compose repo), and an approximate version doesn't affect
    # correctness there anyway -- SonarQube's PR-analysis mode defines "new
    # code" as diff-vs-target-branch, not by version. A job-level `if:`
    # here (rather than per-step) means PR runs mark this `skipped` without
    # ever starting a runner -- zero cost, not just cheap. `sonarqube`
    # supplies its own plain-git fallback for PR runs where this job never
    # ran at all (see that job below).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      # contents: write, not just read -- confirmed by testing: even with
      # dryRun: true, semantic-release's core verification phase performs
      # an actual git-push permission check (not merely a read-only
      # preview), and fails outright ("Cannot push to the Git repository",
      # EGITNOPERMISSION) without write access, despite never actually
      # creating anything.
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # semantic-release needs full tag history

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install semantic-release
        # No package.json in this repo -- semantic-release runs fine
        # without one (see .releaserc.json for its config), so it's
        # installed ephemerally per-run rather than adding a second
        # language toolchain to this otherwise Go-only repo. Exact-pinned
        # (no ^/~ range) and --ignore-scripts: unpinned + script-executing
        # installs of third-party packages both flagged by SonarQube
        # (githubactions:S8543, S6505) as supply-chain risks.
        #
        # No conventional-changelog-conventionalcommits/custom "preset"
        # here -- confirmed by testing in sonarqube-compose that
        # @semantic-release/release-notes-generator bundles its own
        # nested, older conventional-changelog-writer that can't be
        # overridden by installing a newer one at the top level (npm won't
        # substitute a version outside a package's own declared range into
        # that package's private resolution). .releaserc.json uses
        # semantic-release's bundled default ("angular") preset instead --
        # no extra package, no version conflicts, and it already
        # recognizes standard Conventional Commits syntax; the custom
        # releaseRules there override the type-to-bump mapping regardless
        # of preset.
        run: npm install --no-save --ignore-scripts semantic-release@25.0.9

      - name: Compute next version (dry run, no tag/release created)
        # Writes to $GITHUB_OUTPUT itself (see the script) rather than via
        # shell redirection -- semantic-release's own logger writes
        # non-key=value progress lines straight to stdout, which would
        # otherwise corrupt $GITHUB_OUTPUT if this whole command's output
        # were naively piped into it.
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/semantic-release/print-next-version.mjs

  build:
    needs: version
    # version is *legitimately* skipped on pull_request (see above), which
    # would otherwise cascade-skip build/test/sonarqube too by default
    # (needs: requires success(), and skipped != success) -- explicitly
    # tolerate that here so PRs still actually get validated. A genuine
    # failure in version (only possible on push) still correctly blocks
    # everything downstream.
    if: always() && (needs.version.result == 'success' || needs.version.result == 'skipped')
    # Re-exposes version's output as its own so `test` (and transitively
    # `sonarqube`) can reach it via a single-hop `needs:` chain instead of
    # reaching directly back to `version`. Empty on PR runs (version didn't
    # run) -- sonarqube supplies its own fallback for that case. Threading
    # it through like this (instead of sonarqube also listing `version`
    # directly in its own needs:) avoids drawing a second, direct
    # version -> sonarqube edge on the Actions graph alongside the
    # version -> build -> test chain -- the same redundant-edge mistake
    # caught and fixed on `publish` in this repo's own history (see git
    # log), just from a different direction.
    outputs:
      version: ${{ needs.version.outputs.version }}
    # go vet, then cross-compile the two binaries the rest of the pipeline
    # needs -- Go's cross-compiler targets linux/amd64 and linux/arm64
    # natively (CGO_ENABLED=0, no gcc/QEMU needed), so this is fast even for
    # the non-native arch.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Cross-compile linux/amd64 + linux/arm64 binaries
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            mkdir -p "dist/linux/${arch}"
            echo "== building linux/${arch} =="
            GOOS=linux GOARCH="${arch}" CGO_ENABLED=0 \
              go build -trimpath -ldflags="-s -w" \
              -o "dist/linux/${arch}/sonarqube-prometheus-exporter" .
          done

      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: dist/
          retention-days: 1

  test:
    needs: build
    # always() && is required, not decorative: GitHub skips *evaluating* a
    # job's if: entirely (short-circuiting straight to "skipped") whenever
    # any ancestor was skipped, unless the condition contains always(),
    # success(), failure(), or cancelled() -- confirmed by testing in the
    # sibling sonarqube-compose repo. A bare `needs.build.result ==
    # 'success'` would still cascade to "skipped" even when build actually
    # succeeded, because version -- an ancestor via build -- is
    # legitimately skipped on every pull_request. always() forces
    # evaluation; the && condition then does the real check, restricted to
    # build's own result rather than the default implicit success(), which
    # checks the *entire* transitive ancestor chain rather than just this
    # job's direct needs:.
    if: always() && needs.build.result == 'success'
    # Re-exposes build's (pass-through of version's) output the same way,
    # one more hop down the chain -- doesn't consume build's binaries
    # itself, the needs: edge is purely for fail-fast ordering (don't
    # bother testing if vet/cross-compile already failed).
    outputs:
      version: ${{ needs.build.outputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      - name: Test with coverage
        # sonar-project.properties points sonar.go.coverage.reportPaths at
        # this exact file/format (Go's native cover profile) -- SonarQube's
        # Go analyzer reads it directly, no conversion step needed.
        run: go test ./... -coverprofile=coverage.out

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 1

  sonarqube:
    needs: test
    # Same reasoning as test's if: above -- always() forces evaluation
    # despite version's skip further up the chain; the && condition
    # restricts to test's own result.
    if: always() && needs.test.result == 'success'
    # Requires SONAR_TOKEN (repo secret) and SONAR_HOST_URL (repo variable)
    # to be set, and the target SonarQube server (this repo's sibling
    # sonarqube-compose stack, tunnelled via ngrok) to be reachable from
    # GitHub-hosted runners at scan time -- see that repo's README
    # "GitHub Integration" section.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # disable shallow clone for better analysis relevancy

      - uses: actions/download-artifact@v8
        with:
          name: coverage

      - name: Resolve version (falls back to latest tag on pull_request, where the version job never runs)
        id: resolved_version
        run: |
          set -euo pipefail
          V="${{ needs.test.outputs.version }}"
          if [ -z "$V" ]; then
            TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)"
            V="${TAG#v}"
          fi
          echo "value=$V" >> "$GITHUB_OUTPUT"

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7.1.0
        with:
          args: >
            -Dsonar.projectVersion=${{ steps.resolved_version.outputs.value }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  release:
    needs: sonarqube
    # Only cut a real release from main, and only once the quality gate has
    # passed. always() forces if: evaluation despite version's skip
    # further up the chain on pull_request runs (moot for release itself,
    # since it's already push-gated below, but needed for consistency --
    # without it this job would show "skipped" on every push too, for the
    # same short-circuiting reason as test/sonarqube above).
    if: always() && github.event_name == 'push' && needs.sonarqube.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install semantic-release
        # See the matching note in the `version` job above -- no
        # conventional-changelog-conventionalcommits, default "angular"
        # preset instead.
        run: npm install --no-save --ignore-scripts semantic-release@25.0.9

      - name: Release
        # Uses the programmatic API (via release.mjs) rather than the
        # plain CLI -- unlike the sibling sonarqube-compose repo, `publish`
        # below needs to know the exact version and whether a release
        # actually happened, which the CLI's exit code/logs don't expose
        # cleanly.
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/semantic-release/release.mjs

  publish:
    needs: release
    # Only publish once release confirms a version was actually cut --
    # always() forces evaluation past version's skip on the ancestor
    # chain, same reasoning as test/sonarqube above.
    if: always() && github.event_name == 'push' && needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: dist/

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        # No QEMU setup needed -- the Dockerfile only COPYs a prebuilt
        # binary per platform, it never executes anything arch-specific.
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push
        # Every push is now a release, so every tag -- :latest, :<sha>, and
        # the version tags -- gets pushed here in one place, once. No more
        # separate "promote an already-built :<sha> image's tags after the
        # fact" step the way the old release-please.yml's
        # publish-release-image job worked (see git history) -- there's no
        # more "ordinary push" vs. "release push" distinction to bridge.
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ needs.release.outputs.version }}
            ${{ env.IMAGE }}:${{ needs.release.outputs.major }}.${{ needs.release.outputs.minor }}
            ${{ env.IMAGE }}:${{ needs.release.outputs.major }}
